<ion-header>
  <ion-toolbar>
    <ion-title>Buscar Cafeterías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar
    [(ngModel)]="busqueda"
    (ionInput)="filtrarCafeterias()"
    placeholder="Buscar por nombre o ubicación"
    clearInput
  >
    <ion-icon name="search" slot="start" color="primary"></ion-icon>
  </ion-searchbar>

  <ion-list>
    <ion-item *ngFor="let cafe of resultados" button [routerLink]="['/cafe-detail', cafe.nombre]">
      <ion-label>
        <h2>{{ cafe.nombre }}</h2>
        <p>{{ cafe.ubicacion }}</p>
        <p><ion-icon name="time-outline"></ion-icon> {{ cafe.horario }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
