<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ cafe?.nombre }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="cafe as c">
  <div class="cafe-container">
    <!-- Imagen principal -->
    <img
      *ngIf="c.imagen"
      [src]="c.imagen"
      alt="{{ c.nombre }}"
      class="cafe-image"
    />

    <div class="cafe-info">
      <h2>{{ c.nombre }}</h2>
      <p>{{ c.descripcion }}</p>

      <ion-item lines="none">
        <ion-icon name="location-outline" slot="start"></ion-icon>
        <ion-label>{{ c.ubicacion }}</ion-label>
      </ion-item>
    </div>

    <!-- Reseñas -->
    <div class="resenas-section" *ngIf="c.resenas.length > 0; else noResenas">
      <h3>Reseñas</h3>

      <ion-list>
        <ion-item *ngFor="let r of c.resenas" lines="none">
          <ion-avatar slot="start">
            <img [src]="r.usuarioAvatar || 'assets/default-avatar.png'" />
          </ion-avatar>

          <ion-label>
            <h2>{{ r.usuario }}</h2>
            <p>{{ r.comentario }}</p>
          </ion-label>

          <ion-icon name="star" color="warning" slot="end"></ion-icon>
          <span slot="end">{{ r.puntuacion }}/5</span>
        </ion-item>
      </ion-list>
    </div>

    <ng-template #noResenas>
      <div class="no-resenas">
        <p>Este café aún no tiene reseñas.</p>
      </div>
    </ng-template>
  </div>
</ion-content>
