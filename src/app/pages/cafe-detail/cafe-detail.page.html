<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/search"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ cafe?.nombre }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Información del café -->
  <ion-card *ngIf="cafe">
    <ion-card-header>
      <ion-card-subtitle>{{ cafe.ubicacion }}</ion-card-subtitle>
      <ion-card-title>{{ cafe.nombre }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p><strong>Horario:</strong> {{ cafe.horario }}</p>
      <p>{{ cafe.descripcion }}</p>
    </ion-card-content>
  </ion-card>

  <!-- Mapa embebido -->
  <ion-card *ngIf="safeMapUrl">
    <iframe
      width="100%"
      height="200"
      frameborder="0"
      style="border:0"
      [src]="safeMapUrl"
      allowfullscreen>
    </iframe>
  </ion-card>

  <!-- Reseñas -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Reseñas</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label>
          <p><strong>Laura</strong>: Excelente café y atención. 🌟🌟🌟🌟🌟</p>
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-label>
          <p><strong>Martín</strong>: Me encantó el ambiente. ☕</p>
        </ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

</ion-content>
